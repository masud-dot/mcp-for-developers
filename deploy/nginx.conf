# Reverse proxy for a remote MCP deployment.  Chapters 17 and 18.

upstream mcp_pool {
    server mcp-1.internal:8000;
    server mcp-2.internal:8000;
    server mcp-3.internal:8000;
}

upstream ops_pool  { server ops-1.internal:8000; }
upstream repo_pool { server repo-1.internal:8000; }

# Route on the MCP headers.  The body is never parsed.  Chapter 17.
map $http_mcp_name $mcp_backend {
    default                 mcp_pool;
    "~^(change_|repo_)"     repo_pool;
    "request_deploy_freeze" ops_pool;
}

# Per-tool rate limiting, keyed on the tool being called.  Chapter 17.
limit_req_zone $http_mcp_name zone=per_tool:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/mcp.example.com.pem;
    ssl_certificate_key /etc/ssl/mcp.example.com.key;

    # Match MCPServer's max_request_body_size.  Chapter 18.
    client_max_body_size 4m;

    location / {
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must exceed your slowest tool.  Chapter 18.
        proxy_read_timeout 65s;

        # Uncomment when serving json_response=False.  Chapter 25.
        # proxy_buffering off;
    }
}
