name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked

      # Ordered by how fast they fail. Chapter 24.
      - name: lint
        run: uv run ruff check src tests

      - name: types
        run: uv run mypy src

      - name: unit
        run: uv run pytest tests/unit -q

      - name: contract
        run: uv run pytest tests/contract -q

      - name: negative
        run: uv run pytest tests/negative -q

      - name: integration
        run: uv run pytest tests/integration -q

      # The security suite mints and verifies its own JWTs, so this only
      # has to be a stable throwaway. It is not a credential and no
      # repository secret is required. Keys must be >= 32 bytes.
      - name: security
        run: uv run pytest tests/security -q
        env:
          MCPDEV_AUTH_SIGNING_KEY: ssssssssssssssssssssssssssssssss